# OneDay SwiftLint 规则（与礼记同款基线：错误级规则拦截，警告级提示）
disabled_rules:
  - trailing_whitespace
opt_in_rules:
  - empty_count
  - closure_spacing
  - redundant_nil_coalescing
  - first_where
line_length:
  warning: 160
  error: 220
identifier_name:
  min_length: 2
excluded:
  - OneDay.xcodeproj
reporter: "xcode"
