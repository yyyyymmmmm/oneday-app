# Hermes 部署包清单（路线 A：补丁正式入包；服务端改动先入包、再从包应用）
package: hermes-deploy
version: 2.11.0   # 双线收口（2026-11-26）：本线 2.8.0（web-login 桥＋凭据库 A+C＋2.7.1 三件回填）与对方线 2.8.0/2.9.0/2.10.0/2.10.1（台账标题与 cron 投影、批准卡多卡、消息附件同体）全量合并取并集；version_gate 与 db_schema_guard 网关接线自 2.7.1 线移回（审计 T-1/T-2）；全表哈希按收口实物复算、manifest/install/verify 三处对平；脱敏五件回填清单见 BACKFILL.md，未回填不许上生产。此前对方线版本：2.10.1（附件投影网关命名空间解析修复）、2.10.0（消息附件同体绑定）、2.9.0（批准卡待批多卡＋原子裁决）、2.8.0（台账 title_human＋cron is_system）。此前本线 2.8.0：面板密码登录桥＋2.7.1 线三件回填；2.7.0：凭据请求列表端点＋聊天 marker。
released: "2026-11-26"
description: 让任何部署者装出与现行 instance 功能一致的 Hermes + OneDay 服务端：上游镜像本体不改，产品行为全部由本包登记的补丁与网关模块承载（companion 伴生容器已于 2.0.0 整退役，单容器终局）。

config_migrations:
  - name: credential-vault-toolset
    source: credential-vault-toolset-config-patch.py
    scope: platform_toolsets.api_server adds only credential_vault
    version: 2.7.0
    note: 2.7.0 was verified as packaged but never left applied; this same-version migration activates its credential-vault tools without a version bump.
  - name: platform-hint
    source: platform-hint-config-patch.py
    scope: instance config gains a top-level platform_hints.api_server.replace substituting the upstream api_server platform hint (formatting stance only; MEDIA/file-delivery semantics preserved verbatim)
    version: 2.8.0
    note: Ported from the 2.7.1 line (a2fecf5c), where it was applied to the live instance on 2026-11-26 and verified already-in-final-form; the script is idempotent (text-scoped edit, byte-identical elsewhere) and writes a timestamped backup next to the config before any change. Upstream hint orders plain text / no markdown, which silently overrode the OneDay bold-anchor writing rule on every api_server session.

