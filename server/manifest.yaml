OST /v1/settings/revoke 三路由＋features.settings_admin 位（随 instance config 的 settings.agent_admin 总闸取值、非补丁在位即声明）＋能力端点表三行，行为本体在 settings_admin 模块，本文件只挂路由、能力位与 handler。2.11.0 收口：消息投影增 attachments（经 oneday_gateway._delivery_index 解析、2.10.1 命名空间口径）；capabilities 的 version_gate 块（min 0.50.125／recommended 0.51.0，env ONEDAY_MIN_APP_VERSION／ONEDAY_RECOMMENDED_APP_VERSION 可覆盖）自 2.7.1 线移回（审计 T-2，此前 main 整块丢失且无退役记录）；cron 列表投影接线（cron_projection）随对方线合入。
