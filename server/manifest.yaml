data_files:
  - name: approval-ledger
    host_path: data/approvals/approval_ledger.jsonl    # 相对部署目录（容器内 /opt/data/approvals/approval_ledger.jsonl）
    owner: approval_projection module (hermes container)
    format: JSONL event log (created/decided/expired/withdrawn/purged, full record snapshot per event)
    retention: undecided records expire after 7 days; decided records purged after 1 year (sweep in module)
    summary: 待批账：发现/聚合层投影，非执行真源；删除不影响审批能力（回滚零残留口径同批 2 回滚基线）。
  - name: crash-reports
    host_path: data/diagnostics/crash_reports.jsonl    # 相对部署目录（容器内 /opt/data/diagnostics/crash_reports.jsonl）
    owner: crash_reports module (hermes container)
    format: JSONL append-only (whitelist crash metadata only, server-scrubbed)
    retention: newest 500 records (sweep on write in module)
    summary: 崩溃报告存储：只含已过隐私门的白名单元数据（无设备名/UUID/路径/地址，服务端二次脱敏）；删除不影响任何功能（回滚零残留口径同批 2）。
  - name: grant-events
    host_path: data/grants/grant_events.jsonl    # 相对部署目录（容器内 /opt/data/grants/grant_events.jsonl）
    owner: grant_projection module (hermes container)
    format: JSONL append-only audit (observed/revoked, metadata only)
    retention: events retained 1 year (user-approved 2026-11-22); automatic purge implemented in 1.6.0 (grant_projection.sweep, batch-2 shape, called at the end of list_grants)
    summary: 授权事件审计：只是索引与留痕、非授权真源（真源＝config command_allowlist 与 write-gate rules.json）；删除不影响任何已立/已撤授权。
  - name: settings-registry-snapshot
    host_path: data/settings/registry.json    # 相对部署目录（容器内 /opt/data/settings/registry.json）
    owner: settings_registry module (hermes container)
    format: JSON snapshot overlay (records with resolved values / later-phase additions)
    retention: n/a (current-value snapshot, not a log)
    summary: 设置注册表运行时快照（一期只读下发时通常不存在，由二期写面产生）：仅作种子覆盖层载当前 value 与新增记录，种子元数据对已知键保持权威；删除即回落包内种子，不影响任何现行设置与功能（回滚零残留口径同批 2）。
  - name: oneday-memory-tree
    host_path: data/memories/oneday/    # 相对部署目录（容器内 /opt/data/memories/oneday/）
    owner: agent pipelines (oneday-memory skill) + oneday_memory module (state/ and INDEX only)
    format: Markdown layer files with odmem provenance trailers + JSONL ledgers (insights/admission) + JSON sidecars (state/heat.json)
    retention: instance-owned; dual-temporal invalidation instead of deletion by default (forgetting flow in the oneday-memory skill)
    summary: OneDay 分层记忆子树（§439）：inbox/scenes/people/groups/journal/bank/insights/identity 八个层目录＋state 机器状态＋admission 准入账。记忆本体即文件本身，删除整树＝记忆归零（模块与端点仍在、回空清单），回滚口径见 memory-mechanism-rollout-20261124.md。

memory_assets:
  # §439 记忆机制的非代码资产：install.sh 3c 首装铺设（只补缺、永不覆盖），
  # 不走 PATCHES/MODULES 通道、不入容器哈希回读（内容属实例数据）。
  - name: seed-memory
    source: seed-memory/
    install_to: data/    # SOUL.md + memories/** + skills/** 按种子内相对路径落位
    semantics: first-install-only per file (existing files are never overwritten)
    summary: 通用种子：起始人格（SOUL）、身份组（IDENTITY/RULES）、L0 双文件骨架与 oneday/ 分层模板、oneday-memory 技能。只含结构与通用口径，零私人记忆，给任何部署者开箱起步。
  - name: memory-cron-jobs
    source: cron/oneday-memory-jobs.json
    install_to: data/cron/jobs.json    # 按 job id 幂等合并，既有作业原样保留
    semantics: merge-by-id (ids 6f1d2c3a-...-4c01 日结 / ...-4c02 周体检)
    summary: OneDay 记忆日结（每日 23:40）与周体检（周日 10:30）两条原生 cron 作业，skills 注入 oneday-memory 程序文件，deliver=local。
  - name: goals-cron-jobs
    source: cron/oneday-goals-jobs.json
    install_to: data/cron/jobs.json    # 按 job id 幂等合并，既有作业原样保留
    semantics: merge-by-id (id 6f1d2c3a-...-4c03 目标进展日结提炼)
    summary: 目标对齐 G-2（2026-11-24）：OneDay 目标进展日结提炼作业（每日 23:50，与记忆日结同窗），智能体回顾当日工作证据、经 goals MCP 门面以 origin=bookkeeping 落账，同目标同日一条由 companion 服务端封顶。
  - name: config-memory-snippet
    source: seed-memory/config-memory-snippet.yaml
    install_to: null    # 不自动落位：部署者与实例 config.yaml 的 memory 段人工对账
    semantics: documentation-only
    summary: config.yaml 记忆段建议值与逐项说明（开关/nudge/write_approval/字符预算口径）。
