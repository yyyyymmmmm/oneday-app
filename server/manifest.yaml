      summary: 网关面 runs 处理（8642）补丁（1.5.0 新增，总表 154）：POST /v1/runs 在无 Idempotency-Key 头时回退取 body 的 client_message_id 作幂等键，走上游 RunIdempotencyStore 同一 scope（鉴权主体派生）/指纹（body 全体＋gateway_session_key 的 sha256）/SQLite 落盘机器——同 id 同体重复提交 202 重演原 run（replayed=true＋Idempotency-Replayed 头、状态取当前 durable 状态），同 id 异体 409 idempotency_key_conflict，窗口为上游保留期 24h（终态记录到期清理、room 保留期可延长）；头在场时头优先、body 仍整体入指纹；字段缺失/null 按未带键处理，非字符串或非 1–255 可见 ASCII 回 400 invalid_client_message_id；GET /v1/capabilities 的 runs_idempotency 加 client_message_id:true 供客户端探测。1.7.0 新增 GET /v1/runs 终态列表（总表 162/163 服务端缺口 G1/G3）：按调用方幂等 scope 隔离、只投影生命周期字段（run 输出等内容字段绝不经此面外泄），供 overview 桥生成运行完成/失败通知条目；capabilities 的 runs_idempotency 加 terminal_list:true。install.sh 中本文件走 MODULES 通道（部署目录初始无此文件、首装新建＋compose 挂载行幂等确保、回滚＝删文件＋compose 回滚），应用语义与全文件补丁同。1.8.0 新增 AI 自反应终态 attach（总表 202，2026-11-24）：_execute_run 的 _finish 在 completed 终态对外可见前同步调 _attach_self_reaction——弹出 self_reaction_pending 里本 run 登记的待挂反应，守卫全过（登记 run_key 与本 run 一致、本轮无其他工具调用（事件回调标记 _run_tool_use，react_to_message 自身事件被抑制且不计入）、emoji 在固定盘内、目标行＝本轮触发的用户消息行、先读守卫防 set_message_reaction 的 tapback toggle 误删）才以 author="agent" 落库；全程吞异常、不拖垮终态落账；_make_run_event_callback 抑制 react_to_message 工具事件转发（App 过程行不见此内部调用）。1.15.0 attach 断链修复（2026-11-24）：①已登记条目被守卫丢弃时不再全静默——条目过期／目标行属他 run／轮内用过其他工具／盘外 emoji／目标行缺失／同反应已在位／会话库不可用各以 warning 级日志写明 reason（无条目时不记，属常态）；外层异常日志由 debug 升 warning。②run 绑定改对账（原 run_key 等值守卫废止）：工具执行上下文里根本不存在 run_id——HERMES_SESSION_KEY 已是会话作用域键、approval 会话键 contextvar 虽由 runs 补丁在启动时绑 run_id、却被 turn runner 在工具执行前重绑为会话键（两路实测皆会话键）；attach 改以自验事实绑定——条目登记时刻须在本 run 创建之后（同会话 turn 租约串行化、死 run 残留条目按过期丢弃），且目标行 display_metadata 的 submission_id 须与本 run 一致（runs 面落行时盖戳）。落库语义（贴触发行／每作者一行／六表情盘／纯聊天轮过滤）零变。1.16.0 标准对齐（2026-11-24）：attach 删 off_palette 守卫（盘外单个 emoji 亦落库、六盘降为推荐集）；tool_use_in_turn 丢弃开回执豁免——新增 _run_first_tool_at（事件回调在首个非 react 工具 tool.started 时刻打点），存活条目 emoji 为 👍 且登记时刻早于该打点则按回执 attach，其余干活轮条目仍丢弃；旧口径「本轮有任何其他工具调用即丢弃」作废（用户裁定 Muse 标准优先）。1.16.0 修订四（2026-11-24）：_attach_self_reaction 退役、改 _audit_self_reaction 终态审计——反应已由工具 handler 在调用时即写落库，本钩子只弹出写记录并回撤唯一写时不可判例（非回执表情且轮内用过其他工具、且非 👍 先行回执）；死 run 残留记录按新鲜度丢弃不回撤。2.2.0 新增选择框终态 attach（§441 潜伏，2026-11-25）：_execute_run 的 _finish 在 completed 分支内、_maybe_social_judge 之后、_set_run_status 发布终态之前同步调 _attach_options——弹出 options_pending 里本 run 登记的待挂选项，守卫全过（登记 run_key 与本 run 一致、校验单源 validate_options 复验、目标行＝本轮最终 assistant 行）才经 options_pending.attach_options 单事务 RMW 写入该行 display_metadata 的 options 键（其余键逐字保留）；全程吞异常 fail-closed、不拖垮终态落账；与自反应 attach 的刻意差异＝无工具轮过滤（干完活再让用户拍板是主场景）；_make_run_event_callback 抑制集放宽为 tool_name in ("react_to_message", "present_options")——present_options 与 react 同为内部旁路，不开回执机、不入活动登记。闸关时 pending 恒空、attach 恒无-op，行为与 2.1.0 一致。2.3.1 时序修复（§441，2026-11-25）：真实流量下终态文本行由交付提交才落库、attach 首查无行曾静默丢卡——_attach_options 改首试同步＋守护线程限时重试（0.25s×5s）等行落库补贴，run_key 不符／载荷复验不过／谱系外／重试耗尽四种丢卡路径全量 warning 留痕（带 session/run 标识）；包内自测新增时序形态用例（目标行第 3 次查询才出现），全套 33/33。2.3.1 修订一（2026-11-25）：真实流量复验抓获第二层断链——handler 登记 run_key 为完整会话键、attach 等值比对裸 run_id 恒不符（1.15.0 自反应同款），改自验事实绑定（等值／后缀／新鲜度三路，死 run 陈旧条目丢弃＋warning）；自测加绑定两用例，全套 35/35。
