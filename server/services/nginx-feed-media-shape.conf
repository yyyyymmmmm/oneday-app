# nginx 静态面模板 —— 动态配图自托管（包 2.6.0，能力 #44）
#
# 用途：动态 feed 配图落服务器自家存储 /opt/data/oneday/media/feed
# （宿主路径 /www/dk_project/dk_app/hermes/data/oneday/media/feed），
# 帖子引用公网自家地址 https://hermes.example.com/feed-media/<sha256>.<ext>，
# 由本 location 以静态文件直出（不经网关、无鉴权——App Nuke 直通公开
# http(s) URL 的口径，查实 2026-11-25）。
#
# 操作口径（应用时，见 feed-images-rollout-20261125.md）：
#   1. 改前整份备份现行 vhost conf 至回滚基线
#      /root/deploypkg-2.6.0-20261125/baseline/（.bak-2.6.0-feedmedia）。
#   2. 把下面「新块」整段插入 hermes.example.com 的 443 server 块内
#      （与既有 location 并列，不改动任何既有块）。
#   3. nginx -t 通过后 reload；公网 curl 自家图 URL 验 200＋image 类型。
#   4. 回滚 = 恢复备份 conf + reload（图文件与 data.json 引用按 rollout
#      文档的基线一并覆回）。
#
# 保形要点：
#   - 文件名 = 内容 sha256，内容不可变 → immutable 长缓存安全。
#   - alias 目标目录链须 www 可读（目录 755／文件 644）。
#   - media 目录树须网关进程属主（uid 10000）可写：网关以 hermes
#     用户运行、托管写盘在此目录；任何带外预置（迁移脚本以 root
#     跑等）建完必须 chown -R 10000:10000，否则生成侧托管静默
#     失败、帖子无图落地（2026-11-25 应用当日实证三轮，gateway.log
#     留痕「landing fallback unhostable」）。
#   - 数据根目录 /www/dk_project/dk_app/hermes/data 原为 700（属主
#     10000），www 穿行被拒、公网 404（2026-11-25 应用实证）：须
#     chgrp www 该目录＋chmod 710（只穿行、不可列目录，文件本体
#     权限不动）——本步与 location 同批执行、回滚时恢复 700/原组。
#   - 只出图：try_files 限定本目录，路径穿越由 ^~ 前缀＋alias 天然约束。

# ---- 新块：feed 配图静态面 ----
    # BEGIN deploypkg 2.6.0 feed-media
    location ^~ /feed-media/ {
        alias /www/dk_project/dk_app/hermes/data/oneday/media/feed/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # END deploypkg 2.6.0 feed-media
