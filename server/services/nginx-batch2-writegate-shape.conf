# nginx 保形转发模板 —— 断桥批二（包 1.10.0）
#
# 用途：write-gate 入网关后，把公网 /api/write-gate/ 从 companion
# 桥端口（127.0.0.1:8643）改指网关 8642 的保形口。
#
# 操作口径（应用时，见 bridge-batch2-rollout-20261124.md）：
#   1. 改前整份备份现行 vhost conf（回滚基线）。
#   2. 用下面「新块」整段替换现行 /api/write-gate/ 块。
#   3. nginx -t 通过后 reload；按 rollout 文档的行为清单验收。
#   4. 回滚 = 恢复备份 conf + reload（桥模块在观察窗内保持在役
#      待命，8643 仍在监听），分钟级、不动数据。
#
# 保形要点（与旧块的差异，缺一不可）：
#   - proxy_pass 不带 URI 部分：完整原始路径
#     /api/write-gate/<...> 原样到达网关，命中 api_server 的
#     保形挂载（与 /v1/write-gate/... 同 handler）；旧块带 /
#     结尾剥前缀是桥形态（桥在根路径挂路由），网关形态带 /
#     会剥掉 /api/write-gate 前缀、保形口即失效。
#   - Authorization 直传：App 的 Bearer（网关登录钥）由网关
#     @_require_auth 自验——桥模块钥 WRITE_GATE_BRIDGE_KEY
#     自此作废（凭据单源）。

# ---- 新块：整段替换现行 /api/write-gate/ 块 ----
    # Write gate (bridge-retirement batch 2, hermes-deploy
    # 1.10.0): the write-gate bridge (8643) is retired into the
    # gateway (write_gate_gateway module); this location forwards
    # the ORIGINAL path to the gateway's shape-preserving mounts
    # so shipped apps keep working unchanged. The app's gateway
    # key is verified by the gateway itself.
    location /api/write-gate/
    {
        proxy_pass http://127.0.0.1:8642;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }
