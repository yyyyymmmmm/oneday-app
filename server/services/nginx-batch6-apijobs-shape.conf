# nginx 精确接线模板 —— 网页端棒 3（包 2.15.0，#55）
#
# 用途：网关（8642）自 2.8.0 起serve GET /api/jobs 并带 OneDay cron
# 投影（cron_projection：is_system 系统分类，即 App 定时任务面的
# 用户可见口径）；但公网 vhost 无 /api/jobs 专属 location，浏览器
# 请求落穿到 location / → dashboard（9119），9119 对 /api/jobs 回
# 404（其实测），网页端定时任务面无源可读。本模板给 vhost 加一条
# 精确 location 把 = /api/jobs 指到网关。
#
# 操作口径（应用时）：
#   1. 改前整份备份现行 vhost conf（回滚基线）。
#   2. 把下面「新块」整段插入 hermes.didichou.site 的 server 块内
#      （建议紧随 = /api/env/reveal 块之后）。
#   3. nginx -t 通过后 reload；按 verify 第 37 节 webjobs-public
#      探针验收（Bearer 公网调 /api/jobs → 200 且含 is_system）。
#   4. 回滚 = 恢复备份 conf + reload，分钟级、不动数据。
#
# 保形要点：
#   - 精确匹配（= /api/jobs）：只接管这一条路径；/api/cron/* 等
#     dashboard 自有面仍走 location / → 9119，不受影响。
#   - proxy_pass 不带 URI 部分：原始路径 /api/jobs 原样到达网关，
#     命中 api_server 的 _handle_list_jobs（_check_auth Bearer 自验）。
#   - Origin 不剥：本站来源已登记 API_SERVER_CORS_ORIGINS
#     （包 2.12.1），浏览器带 Origin 请求可过 CORS 闸；外部来源
#     仍被闸拦。

# ---- 新块：插入 hermes.didichou.site server 块 ----
    # Cron jobs user-visible face (web bar 3, hermes-deploy
    # 2.15.0): the gateway (8642) serves GET /api/jobs with the
    # OneDay cron projection (is_system classification); without
    # this exact location the path falls through to the dashboard
    # (9119), which 404s /api/jobs. Exact match only: /api/cron/*
    # stays on the dashboard.
    location = /api/jobs
    {
        proxy_pass http://127.0.0.1:8642;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }
