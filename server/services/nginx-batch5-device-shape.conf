# nginx 保形转发模板 —— 断桥批五·终局（包 2.0.0）
#
# 用途：device 入网关后，把公网 /api/device-bridge/ 与 /api/device-mcp
# 从已退役的桥端口改指网关 8642 的保形面；companion 容器同批下线。
#
# 操作口径（应用时，见 bridge-teardown-rollout-20261125.md）：
#   1. 改前整份备份现行 vhost conf（回滚基线
#      /root/deploypkg-2.0.0-20261125/baseline/）。
#   2. 用下面「新块」整段替换现行两块。
#   3. nginx -t 通过后 reload；按 rollout 文档的行为清单验收。
#   4. 回滚 = 恢复备份 conf + reload，并按 rollout 文档恢复
#      companion 与桥数据（基线内全量快照）。
#
# 保形要点：
#   - device-bridge 块 proxy_pass 不带 URI 部分：完整原始路径
#     /api/device-bridge/<...> 原样到达网关，命中 api_server 的
#     保形挂载 /api/device-bridge/{tail}；带 / 结尾会剥前缀失效。
#   - 摘 auth_request /__bridge_auth 与 Authorization 换钥：
#     App 呈单钥（API_SERVER_KEY）、模块自验（fail-closed），
#     /health 保持免钥——与桥时代口径一致、钥单源化。
#   - device-mcp 块 proxy_pass 带完整目标路径 /api/device-mcp
#     （exact 匹配、路径不变），Authorization 透传不变（Hermes
#     侧现行已改走 127.0.0.1:8642 直连，本公网面供 App/外部）。

# ---- 新块 1：device 通道 ----
    # Device channel (bridge-retirement batch 5, hermes-deploy
    # 2.0.0): the device bridge is retired; the channel now
    # lives in the gateway (device_gateway module). Original path
    # forwarded unchanged to the gateway shape-preserving mount.
    # No auth_request, no key swap: the app presents the single
    # gateway key and the module verifies it (health stays open).
    location /api/device-bridge/
    {
        proxy_pass http://127.0.0.1:8642;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

# ---- 新块 2：device MCP 门面 ----
    location = /api/device-mcp
    {
        proxy_pass http://127.0.0.1:8642/api/device-mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
