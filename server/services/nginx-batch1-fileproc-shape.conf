# nginx 保形转发模板 —— 断桥批一（包 1.8.0）
#
# 用途：fileproc 入网关后，把公网 /api/fileproc-bridge/ 从桥端口
# （宿主 8651）改指网关 8642 的保形口；同时整段删除 channels 的
# location。identity 的 location 本批不动（头像面批四才迁）。
#
# 操作口径（应用时，见 bridge-batch1-rollout-20261124.md）：
#   1. 改前整份备份现行 vhost conf（回滚基线）。
#   2. 用下面「新块」整段替换现行 /api/fileproc-bridge/ 块；
#      整段删除现行 /api/channels-bridge/ 块。
#   3. nginx -t 通过后 reload；按 rollout 文档的行为清单验收。
#   4. 回滚 = 恢复备份 conf + reload（桥模块在观察窗内保持在役
#      待命，8651 仍在监听），分钟级、不动数据。
#
# 保形要点（与旧块的三处差异，缺一不可）：
#   - proxy_pass 不带 URI 部分：完整原始路径
#     /api/fileproc-bridge/<...> 原样到达网关，命中 api_server
#     的保形挂载（与 /v1/files/spreadsheet、/v1/media/rendition
#     同 handler）；带 / 结尾会剥前缀、保形口即失效。
#   - 摘 auth_request /__bridge_auth：不再由 nginx 验登录钥。
#   - 摘 Authorization 换钥行：App 的 Bearer（网关登录钥）直达
#     网关，由网关 @_require_auth 自验——桥模块钥自此作废。

# ---- 新块：整段替换现行 /api/fileproc-bridge/ 块 ----
    # File processing (bridge-retirement batch 1, hermes-deploy
    # 1.8.0): spreadsheet transcode + media rendition now live in
    # the gateway (fileproc_gateway module); this location forwards
    # the ORIGINAL path to the gateway's shape-preserving mounts so
    # shipped apps keep working unchanged. No auth_request, no key
    # swap: the app's gateway key is verified by the gateway itself.
    location /api/fileproc-bridge/
    {
        proxy_pass http://127.0.0.1:8642;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

# ---- 删除块：现行 /api/channels-bridge/ 整段删除 ----
# （channels 模块整退：状态/凭据 App 已 Dashboard 直连、QR 零
# 调用，见 bridge-batch1-rollout-20261124.md 的证据节。删除后
# 该路径回落默认 404，属预期。）
