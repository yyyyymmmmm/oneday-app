# device-bridge nginx routes -- DRAFT ONLY (2026-11-10), NOT ACTIVE.
# To be added to hermes.didichou.site.conf in the same approval batch as
# registering the MCP facade in Hermes config (production change,
# separate sign-off; see device-connectors-design-20261110.md S7).
# Do not deploy from this file alone.

# App device channel (session / heartbeat / long-poll / respond).
# Long-poll holds up to 25s and a forwarded call up to 30s, so the read
# timeout must exceed both.
location /api/device-bridge/
{
    proxy_pass http://127.0.0.1:8647/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 120s;
}

# Hermes MCP facade (streamable-http JSON-RPC endpoint of the bridge).
location = /api/device-mcp
{
    proxy_pass http://127.0.0.1:8647/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
