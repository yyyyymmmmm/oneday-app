name: CI Guard (Symbol Motion & Server Selftests)

on:
  push:
    branches: [main, "rel-*", "feat/*", "refactor/*"]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-guard-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  symbol-motion-and-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cryptography for real AES-256-GCM vault tests
        run: python3 -m pip install --upgrade pip cryptography

      - name: Symbol motion registry check
        run: |
          python3 Scripts/ci/check_symbol_motion.py --selftest
          python3 Scripts/ci/check_symbol_motion.py

      - name: Compile all server patches and migration scripts
        run: python3 -m py_compile server/patches/*.py server/migrate_json_to_sqlite.py server/oneday_db_selftest.py

      - name: Unified SQLite WAL, push scheduler & modularization selftest
        run: python3 server/oneday_db_selftest.py

      - name: Auth tokens & push tokens selftests
        run: |
          python3 server/auth_tokens_selftest.py
          python3 server/push_tokens_selftest.py
          if [ -f server/push_sender_and_schema_guard_selftest.py ]; then
            python3 server/push_sender_and_schema_guard_selftest.py
          fi

      - name: Credential vault v2/v1 envelope selftest (real AES-256-GCM)
        run: python3 server/credential_vault_selftest.py

      - name: Bitwarden link selftest
        run: |
          if [ -f server/patches/bitwarden_link_selftest.py ]; then
            python3 server/patches/bitwarden_link_selftest.py
          fi
