name: Debug Mac (tmate SSH)

# Manual-only debug entry point: opens a tmate session on a free
# GitHub-hosted macOS runner. Access is restricted to the SSH public
# key below via tmate-authorized-keys — the connection string printed
# in the log is useless without the matching private key.
# The connection string is also uploaded as the "tmate-ssh" artifact,
# because job logs are not readable via API while a run is in progress.
# Stop the session by cancelling the run.

on:
  workflow_dispatch:

jobs:
  debug-mac:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Install tmate
        run: brew install tmate

      - name: Start tmate session (authorized key only)
        env:
          DEBUG_SSH_PUBKEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9w9oWkcFoFu/Qc/KxCgiLSSfzCCqBbEvMealEqtJBW hatch
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEBUG_SSH_PUBKEY" > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          printf 'set -g tmate-authorized-keys "%s/.ssh/authorized_keys"\n' "$HOME" > "$HOME/.tmate.conf"
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          SSH_STR="$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')"
          echo "TMATE_SSH=$SSH_STR"
          printf '%s\n' "$SSH_STR" > "$GITHUB_WORKSPACE/tmate-ssh.txt"

      - name: Upload connection string
        uses: actions/upload-artifact@v4
        with:
          name: tmate-ssh
          path: tmate-ssh.txt
          retention-days: 1

      - name: Hold runner for the debug session (job cap 360 min)
        run: sleep 19800
