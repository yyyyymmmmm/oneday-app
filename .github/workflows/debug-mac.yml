name: Debug Mac (tmate SSH)

# Manual-only debug entry point: opens a tmate session on a free
# GitHub-hosted macOS runner. Access is restricted to the SSH public
# key below via tmate-authorized-keys — the connection string is
# useless without the matching private key.
# The connection string is uploaded as the "tmate-ssh" artifact,
# because job logs are not readable via API while a run is in progress.
# Stop the session by cancelling the run.

on:
  workflow_dispatch:

jobs:
  debug-mac:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Install tmate
        run: brew install tmate

      - name: Start tmate session (authorized key only)
        env:
          DEBUG_SSH_PUBKEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9w9oWkcFoFu/Qc/KxCgiLSSfzCCqBbEvMealEqtJBW hatch
        run: |
          set -uxo pipefail
          cd "$GITHUB_WORKSPACE"
          # --- network probes toward tmate.io (diagnostics) ---
          {
            echo '== dig =='; dig +short ssh.tmate.io || nslookup ssh.tmate.io
            echo '== tcp 22 =='; nc -vz -w 8 ssh.tmate.io 22
            echo '== ssh banner =='; ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -o BatchMode=yes -T ssh.tmate.io true
          } > diag-net.txt 2>&1 || true
          # --- tmate with verbose server/client logs ---
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEBUG_SSH_PUBKEY" > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          printf 'set -g tmate-authorized-keys "%s/.ssh/authorized_keys"\n' "$HOME" > "$HOME/.tmate.conf"
          tmate -S /tmp/tmate.sock -v new-session -d >/dev/null 2>&1 </dev/null || true
          SSH_STR=""
          for i in $(seq 1 45); do
            SSH_STR="$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || true)"
            [ -n "$SSH_STR" ] && break
            sleep 2
          done
          echo "TMATE_SSH=$SSH_STR"
          printf '%s\n' "$SSH_STR" > "$GITHUB_WORKSPACE/tmate-ssh.txt"
          tmate -S /tmp/tmate.sock show-messages > diag-tmate-messages.txt 2>&1 || true
          [ -n "$SSH_STR" ]

      - name: Upload debug bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmate-ssh
          path: |
            tmate-ssh.txt
            diag-net.txt
            diag-tmate-messages.txt
            tmate-*.log
          if-no-files-found: warn
          retention-days: 1

      - name: Hold runner for the debug session (job cap 360 min)
        run: sleep 19800
