name: Screenshots (demo mode)

on:
  workflow_dispatch:
    inputs:
      only_testing:
        description: "只跑指定测试标识（如 OneDayUITests/ComposerKeyboardTests），空＝全部 UI 测试"
        required: false
        default: ""
      device:
        description: "模拟器设备名"
        required: false
        default: "iPhone 17"
  push:
    branches: [feat/ia-v3]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Project.swift"
      - "Tuist.swift"
      - ".github/workflows/screenshots.yml"

jobs:
  shots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install Tuist
        run: brew install tuist

      - name: Generate project
        run: tuist generate --no-open

      - name: Ensure simulator exists
        run: |
          # 2026-11-09：有过 runner 无任何可用模拟器导致 destination 匹配失败（run 42501703525）；
          # 缺失时用最新 iOS runtime + 对应设备类型现场创建一个（设备名可经 workflow_dispatch 输入换）。
          DEVICE="${{ inputs.device }}"
          DEVICE="${DEVICE:-iPhone 17}"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          if ! xcrun simctl list devices available | grep -qF "$DEVICE ("; then
            RUNTIME=$(xcrun simctl list runtimes available | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
            DEVTYPE=$(xcrun simctl list devicetypes | grep -F "$DEVICE" | grep -oE 'com.apple.CoreSimulator.SimDeviceType.[A-Za-z0-9-]+' | head -1)
            echo "creating $DEVICE: $DEVTYPE / $RUNTIME"
            xcrun simctl create "$DEVICE" "$DEVTYPE" "$RUNTIME"
          fi
          xcrun simctl list devices available | grep "iPhone" | head -5

      - name: UI tests (screenshots, demo mode)
        run: |
          set -o pipefail
          TESTARG="-only-testing:OneDayUITests"
          if [ -n "${{ inputs.only_testing }}" ]; then
            TESTARG="-only-testing:${{ inputs.only_testing }}"
          fi
          echo "TESTARG=$TESTARG DEVICE=$DEVICE"
          xcodebuild test \
            -project OneDay.xcodeproj \
            -scheme OneDayApp \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            "$TESTARG" \
            -resultBundlePath build/shots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee shots-full.log
          grep -E "error:|Test Case|Executed|TEST" shots-full.log | head -40 || true

      - name: Export screenshot attachments
        if: always()
        run: |
          mkdir -p shots-out shots-final
          xcrun xcresulttool export attachments \
            --path build/shots.xcresult \
            --output-path shots-out
          ls -la shots-out || true
          python3 - <<'PY'
          import glob, json, os, shutil

          out_dir, final_dir = "shots-out", "shots-final"
          wanted = ["01-connect", "02-chat", "03-chat-sidebar", "04-overview", "05-files", "06-settings"]
          found = {}

          manifest = os.path.join(out_dir, "manifest.json")
          if os.path.exists(manifest):
              data = json.load(open(manifest))
              entries = data if isinstance(data, list) else data.get("tests", [])
              for entry in entries:
                  for att in entry.get("attachments", []):
                      human = att.get("suggestedHumanReadableName", "")
                      exported = att.get("exportedFileName", "")
                      for name in wanted:
                          if name in human:
                              src = os.path.join(out_dir, exported)
                              if os.path.exists(src):
                                  found[name] = src
                      # 0.2.6/0.2.7 诊断附件（kb-*/probe-*）：缺陷定位证据，一并导出供人工看图
                      if "kb-" in human or "probe-" in human:
                          src = os.path.join(out_dir, exported)
                          if os.path.exists(src):
                              safe = human.replace("/", "_").replace(" ", "_")
                              if not safe.endswith(".png"):
                                  safe += ".png"
                              shutil.copy(src, os.path.join(final_dir, safe))
                              print("diagnostic exported:", safe)

          # 兜底：manifest 对不上时，任何文件名带目标前缀的 PNG 都收
          if len(found) < len(wanted):
              for path in glob.glob(os.path.join(out_dir, "**", "*.png"), recursive=True):
                  base = os.path.basename(path)
                  for name in wanted:
                      if base.startswith(name) and name not in found:
                          found[name] = path

          for name, src in found.items():
              shutil.copy(src, os.path.join(final_dir, name + ".png"))
          print("exported:", sorted(os.listdir(final_dir)))
          missing = [n for n in wanted if n not in found]
          if missing:
              print("MISSING:", missing)
          PY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneday-shots
          path: shots-final/*.png
          if-no-files-found: error
