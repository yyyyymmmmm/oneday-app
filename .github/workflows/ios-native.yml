name: Build iOS (native, unsigned IPA)

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "App/**"
      - "Project.swift"
      - "Tuist.swift"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:

jobs:
  build-native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install Tuist
        run: brew install tuist

      - name: Generate project
        run: tuist generate --no-open

      - name: Build (no codesign)
        run: |
          set -o pipefail
          xcodebuild build \
            -project OneDay.xcodeproj \
            -scheme OneDayApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build-full.log
          grep -E "error:|BUILD" build-full.log | head -60 || true

      - name: Unit tests (OneDayCore)
        run: |
          set -o pipefail
          xcodebuild test \
            -project OneDay.xcodeproj \
            -scheme OneDayApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:OneDayCoreTests -only-testing:OneDayAppTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee test-full.log
          grep -E "error:|Test Case|Executed|TEST" test-full.log | head -60 || true

      # §184 flake 取证：测试进程「意外退出」时 stdout
      # 无死因原文，崩溃/看门狗报告落在模拟器设备的
      # DiagnosticReports 里——无论成败都把近 40 分钟
      # 内 OneDayApp 与 Jetsam 报告的头部倾印进日志
      # （异常类型＋终止原因＋故障线程足够定性）
      - name: Dump simulator crash diagnostics
        if: always()
        run: |
          find ~/Library/Developer/CoreSimulator/Devices \
            -path "*DiagnosticReports*" -mmin -40 \
            \( -name "*OneDay*" -o -name "*Jetsam*" -o -name "*testmanagerd*" \) \
            2>/dev/null | while read -r f; do
              echo "===== $f"
              head -c 6000 "$f" || true
              echo
            done
          echo "--- host DiagnosticReports (recent) ---"
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5 || true

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products -name "OneDay*.app" -type d | head -1)
          test -n "$APP"
          BIN=$(basename "$APP" .app)
          test -x "$APP/$BIN"
          echo "APP=$APP BIN=$BIN"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry oneday-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: oneday-unsigned-ipa
          path: oneday-unsigned.ipa
          if-no-files-found: error
