name: Build iOS (native, unsigned IPA)

on:
  push:
    branches: [main, "rel-*", "feat/*", "refactor/*"]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "App/**"
      - "Project.swift"
      - "Tuist.swift"
      - "Tuist/**"
      - "Scripts/ci/**"
      - ".github/workflows/ios-native.yml"
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
    steps:
      - uses: actions/checkout@v4

      # §247.1（动效规矩包）：符号动效登记核查——未入
      # SymbolMotionRegistry 的 symbolEffect/Lottie 接
      # 入点在此判红，先于构建止步
      - name: Symbol motion registry check
        run: |
          python3 Scripts/ci/check_symbol_motion.py --selftest
          python3 Scripts/ci/check_symbol_motion.py

      - name: Install Tuist
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          tool_versions: |
            tuist 4.218.2

      - name: Verify build tools
        run: |
          xcodebuild -version
          tuist version

      - name: Install Tuist dependencies
        run: tuist install

      - name: Generate project
        run: tuist generate --no-open

      - name: Build (no codesign)
        run: |
          xcodebuild build \
            -workspace OneDay.xcworkspace \
            -scheme OneDayApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build-full.log

      - name: Build simulator test targets
        id: simulator-build
        run: |
          # Simulator test hosts need an application identifier for Keychain access.
          xcodebuild build-for-testing \
            -workspace OneDay.xcworkspace \
            -scheme OneDayApp \
            -destination "$IOS_TEST_DESTINATION" \
            -derivedDataPath build/test-dd \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee test-build.log

      - name: Core and app tests
        run: |
          xcodebuild test-without-building \
            -workspace OneDay.xcworkspace \
            -scheme OneDayApp \
            -destination "$IOS_TEST_DESTINATION" \
            -derivedDataPath build/test-dd \
            -only-testing:OneDayCoreTests -only-testing:OneDayAppTests \
            2>&1 | tee test-full.log

      - name: UI tests
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building \
            -workspace OneDay.xcworkspace \
            -scheme OneDayApp \
            -destination "$IOS_TEST_DESTINATION" \
            -derivedDataPath build/test-dd \
            -only-testing:OneDayUITests \
            2>&1 | tee ui-test-full.log

      - name: Markdown performance (Release)
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' }}
        run: |
          xcodebuild test \
            -workspace OneDay.xcworkspace \
            -scheme OneDayCore \
            -configuration Release \
            -destination "$IOS_TEST_DESTINATION" \
            -derivedDataPath build/test-dd \
            -parallel-testing-enabled NO \
            -only-testing:OneDayCoreTests/MarkdownEngineDifferentialTests/testPerformanceGate \
            ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee markdown-performance.log

      - name: Upload build and test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-and-test-logs
          path: |
            build-full.log
            test-build.log
            test-full.log
            ui-test-full.log
            markdown-performance.log
          if-no-files-found: ignore
          retention-days: 7

      # §241（大厂九项③拍板，DiagnosticReports 常驻化带隐私门）：
      # 只收崩溃元数据——.ips 原文不出 runner，提取脚本走字段
      # 白名单＋全文脱敏（Scripts/ci/crash_metadata.py --selftest
      # 可验）；仓库变量 CRASH_METADATA_COLLECTION=off 即整段
      # 关停（可关）；artifact retention-days 7（限期保存）。
      # 取代 2026-11-13 取证临时步 7a95fe9 的「原文全量上传」形态。
      - name: Collect crash metadata (DiagnosticReports, metadata only)
        if: ${{ !cancelled() && vars.CRASH_METADATA_COLLECTION != 'off' }}
        run: |
          mkdir -p diag-in
          cp -a ~/Library/Logs/DiagnosticReports/. diag-in/ 2>/dev/null || true
          sudo cp -a /Library/Logs/DiagnosticReports/. diag-in/ 2>/dev/null || true
          sudo chmod -R a+rX diag-in 2>/dev/null || true
          python3 Scripts/ci/crash_metadata.py --out crash-metadata diag-in
          rm -rf diag-in

      - name: Upload crash metadata
        if: ${{ !cancelled() && vars.CRASH_METADATA_COLLECTION != 'off' }}
        uses: actions/upload-artifact@v4
        with:
          name: crash-metadata
          path: crash-metadata
          if-no-files-found: warn
          retention-days: 7

      - name: Package unsigned IPA
        run: |
          app=build/dd/Build/Products/Release-iphoneos/OneDayApp.app
          test -x "$app/OneDayApp"
          mkdir -p build/package/Payload
          cp -R "$app" build/package/Payload/
          (cd build/package && zip -qry ../../oneday-unsigned.ipa Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: oneday-unsigned-ipa
          path: oneday-unsigned.ipa
          if-no-files-found: error
