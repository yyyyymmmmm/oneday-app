name: Build iOS (native, unsigned IPA)

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "App/**"
      - "Project.swift"
      - "Tuist.swift"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:
    inputs:
      only_testing:
        description: "可选：单个 -only-testing 标识（如 OneDayAppTests/Class/test）；空＝全量两目标"
        required: false
        default: ""
      forensics_only:
        description: "§184 取证专用：true＝只跑 RuntimeRoot atos 点名步、跳过构建/测试/打包"
        required: false
        default: ""

jobs:
  build-native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # §184 取证点名（forensics_only=true 时唯一执行的步）：
      # 运行时框架真身在 CoreSimulator 卷 RuntimeRoot 下，
      # 以 run 43365948799 的 .ips 镜像基址＋偏移 atos 点名
      - name: Forensics symbolicate (RuntimeRoot atos)
        if: inputs.forensics_only == 'true'
        run: |
          ROOT=$(find /Library/Developer/CoreSimulator/Volumes/iOS_23F77 \
            -type d -name RuntimeRoot 2>/dev/null | head -1)
          echo "RuntimeRoot: $ROOT"
          if [ -z "$ROOT" ]; then echo "<RuntimeRoot not found>"; exit 0; fi
          sym() {
            fw="$1"; base="$2"; wantuuid="$3"; shift 3
            bin="$ROOT/System/Library/Frameworks/$fw.framework/$fw"
            echo "===== $fw -> $bin"
            ls -la "$bin" || return 0
            echo "-- dwarfdump uuid (want $wantuuid):"
            xcrun dwarfdump --uuid "$bin" || true
            for off in "$@"; do
              addr=$(python3 -c "print(hex($base + $off))")
              echo "-- $fw +$off (addr $addr):"
              xcrun atos -o "$bin" -arch arm64 -l "$base" "$addr" || true
            done
          }
          sym SwiftData 7824244736 \
            2449226e-2e13-3ad7-8ae3-5a808ecd2224 \
            502888 569200 645616
          sym _SwiftData_SwiftUI 4303650816 \
            d38c54b9-7e0a-372b-84c7-2199f8b45417 \
            23828 24356

      - name: Show Xcode
        if: inputs.forensics_only != 'true'
        run: xcodebuild -version

      - name: Install Tuist
        if: inputs.forensics_only != 'true'
        run: brew install tuist

      - name: Generate project
        if: inputs.forensics_only != 'true'
        run: tuist generate --no-open

      - name: Build (no codesign)
        if: inputs.forensics_only != 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -project OneDay.xcodeproj \
            -scheme OneDayApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build-full.log
          grep -E "error:|BUILD" build-full.log | head -60 || true

      - name: Unit tests (OneDayCore)
        if: inputs.forensics_only != 'true'
        run: |
          set -o pipefail
          ONLY=(-only-testing:OneDayCoreTests -only-testing:OneDayAppTests)
          if [ -n "${{ inputs.only_testing }}" ]; then
            ONLY=(-only-testing:"${{ inputs.only_testing }}")
          fi
          echo "only-testing filter: ${ONLY[*]}"
          xcodebuild test \
            -project OneDay.xcodeproj \
            -scheme OneDayApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            "${ONLY[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test-full.log
          grep -E "error:|Test Case|Executed|TEST" test-full.log | head -60 || true

      # §184 flake 取证：测试进程「意外退出」时 stdout
      # 无死因原文，报告落在两处——模拟器应用是宿主
      # 进程，其 .ips 进宿主机 ~/Library/Logs/
      # DiagnosticReports（run 43243648978 实证：旧步只
      # find 设备目录、宿主目录只列文件名，两份
      # OneDayApp .ips 的内容从未被倾印）；设备内报告
      # 进 CoreSimulator Devices 的 DiagnosticReports。
      # 无论成败都把近 4 小时内相关 .ips 的头部（异常
      # 类型＋终止原因＋崩溃线程）与关键行摘录（VM
      # Region 等）倾印进日志，供死因定性。
      - name: Dump simulator crash diagnostics
        if: ${{ always() && inputs.forensics_only != 'true' }}
        run: |
          set +e
          dump_ips() {
            case "$1" in *.ips) ;; *) return 0 ;; esac
            [ -f "$1" ] || return 0
            echo "===== $1"
            ls -l "$1"
            head -n 160 "$1"
            echo "----- key lines: $1"
            grep -nE "Exception Type|Exception Subtype|Termination|Crashed Thread|Code Type" "$1" | head -30
            grep -nA4 "VM Region Summary" "$1" | head -12
            grep -nE "^VM Region" "$1" | head -5
            echo
          }
          echo "--- host DiagnosticReports (all, newest first) ---"
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -20
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 -type f -mmin -240 \
            \( -name "*OneDay*" -o -name "*Jetsam*" -o -name "*testmanagerd*" -o -name "*xctest*" \) \
            -print0 2>/dev/null | xargs -0 ls -t 2>/dev/null | head -6 | while read -r f; do
              dump_ips "$f"
            done
          echo "--- simulator device DiagnosticReports ---"
          find ~/Library/Developer/CoreSimulator/Devices \
            -path "*DiagnosticReports*" -type f -mmin -240 \
            \( -name "*OneDay*" -o -name "*Jetsam*" -o -name "*testmanagerd*" -o -name "*xctest*" \) \
            -print0 2>/dev/null | xargs -0 ls -t 2>/dev/null | head -6 | while read -r f; do
              dump_ips "$f"
            done
          # §184 取证补全（点名轮）：.ips 全文收集成
          # artifact（头部摘录不够符号化——usedImages 与
          # 全部线程都在文件后段），并当场对无符号帧跑
          # atos 符号化（构建产物与运行时卷只在本机在场）
          mkdir -p crash-artifacts
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 -type f -mmin -240 \
            \( -name "*OneDay*" -o -name "*Jetsam*" -o -name "*testmanagerd*" -o -name "*xctest*" \) \
            2>/dev/null | while read -r f; do cp "$f" crash-artifacts/ 2>/dev/null; done
          find ~/Library/Developer/CoreSimulator/Devices \
            -path "*DiagnosticReports*" -type f -mmin -240 \
            \( -name "*OneDay*" -o -name "*Jetsam*" -o -name "*testmanagerd*" -o -name "*xctest*" \) \
            2>/dev/null | while read -r f; do cp "$f" crash-artifacts/ 2>/dev/null; done
          ls -la crash-artifacts/ || true
          # 运行时框架定位诊断（.ips 中 path 被脱敏，
          # atos 找二进制屡空——把候选根全摊开记档）
          {
            echo "--- runtime locate diagnostics ---"
            xcrun --sdk iphonesimulator --show-sdk-path || true
            ls /Volumes 2>/dev/null || true
            mount | grep -iE "cryptex|simulator" | head -10 || true
            xcrun simctl list runtimes 2>/dev/null | head -20 || true
            find /Volumes -maxdepth 5 -name "SwiftData.framework" \
              2>/dev/null | head -5 || true
            ls "$(xcrun --sdk iphonesimulator --show-sdk-path)/System/Library/Frameworks" \
              2>/dev/null | grep -i swift | head -10 || true
          } | tee crash-artifacts/runtime-diag.txt || true
          if ls crash-artifacts/*.ips >/dev/null 2>&1; then
            python3 .github/scripts/symbolicate_ips.py crash-artifacts/*.ips \
              | tee crash-artifacts/symbolication.txt || true
            # 备援一：lldb crashlog（脚本在 .app 的
            # SharedFrameworks、不在 Developer 目录内，
            # 找根须取整个 .app）
            APPDIR=$(xcode-select -p | sed 's|/Contents/Developer$||')
            CL=$(find "$APPDIR" -name "crashlog.py" \
              2>/dev/null | head -1)
            echo "crashlog.py: ${CL:-<not found>}"
            if [ -n "$CL" ]; then
              for ips in crash-artifacts/*.ips; do
                echo "===== lldb crashlog: $ips (script: $CL)"
                perl -e 'alarm 240; exec @ARGV' -- \
                  xcrun lldb -b \
                  -o "command script import $CL" \
                  -o "crashlog $ips" </dev/null 2>&1 \
                  | tee crash-artifacts/lldb-crashlog.txt || true
              done
            fi
            # 备援二：运行时缓存点名——运行时框架只在
            # dyld 共享缓存里（无独立文件），以缓存为
            # lldb target 按镜像名＋偏移解析帧 0 等。
            # 先探卷布局（上轮 maxdepth 9 定名未命中），
            # 再按探得的路径动态取缓存
            VOL=$(ls -d /Library/Developer/CoreSimulator/Volumes/iOS_* \
              2>/dev/null | sort -V | tail -1)
            echo "runtime volume: ${VOL:-<none>}"
            if [ -n "$VOL" ]; then
              echo "--- volume root ---"
              ls "$VOL" || true
              echo "--- volume System/Library (head) ---"
              ls "$VOL/System/Library" 2>/dev/null | head -30 || true
              echo "--- find dyld_shared_cache* ---"
              find "$VOL" -name "dyld_shared_cache*" \
                2>/dev/null | head -5 || true
              echo "--- find SwiftData.framework ---"
              find "$VOL" -name "SwiftData.framework" \
                2>/dev/null | head -5 || true
            fi
            CACHE=""
            if [ -n "$VOL" ]; then
              CACHE=$(find "$VOL" -name "dyld_shared_cache_arm64*" \
                2>/dev/null | grep -v symbols | head -1)
            fi
            echo "shared cache: ${CACHE:-<none>}"
            if [ -n "$CACHE" ]; then
              perl -e 'alarm 420; exec @ARGV' -- \
                xcrun lldb -b \
                -o "target create $CACHE" \
                -o "command script import .github/scripts/cache_symbolicate.py" \
                -o "cache-sym SwiftData 502888 569200 645616" \
                -o "cache-sym _SwiftData_SwiftUI 23828 24356" \
                </dev/null 2>&1 \
                | tee crash-artifacts/lldb-cache.txt || true
            fi
            # 设备侧报告扫尾（模拟器自身 ReportCrash 若
            # 产出，符号通常齐全）——任意名全列
            find ~/Library/Developer/CoreSimulator/Devices \
              -name "*.ips" -mmin -240 2>/dev/null | head -20 || true
          fi
          true

      - name: Upload crash reports
        if: ${{ always() && inputs.forensics_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: crash-artifacts/
          if-no-files-found: ignore

      - name: Package unsigned IPA
        if: inputs.forensics_only != 'true'
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products -name "OneDay*.app" -type d | head -1)
          test -n "$APP"
          BIN=$(basename "$APP" .app)
          test -x "$APP/$BIN"
          echo "APP=$APP BIN=$BIN"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry oneday-unsigned.ipa Payload

      - name: Upload IPA
        if: inputs.forensics_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oneday-unsigned-ipa
          path: oneday-unsigned.ipa
          if-no-files-found: error
