name: Build iOS (native, unsigned IPA)

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "App/**"
      - "Project.swift"
      - "Tuist.swift"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:
    inputs:
      only_testing:
        description: "逗号分隔的 -only-testing 目标（空＝全量三套）"
        required: false
        default: ""

jobs:
  build-native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install Tuist
        run: brew install tuist

      - name: Generate project
        run: tuist generate --no-open

      - name: Build (no codesign)
        run: |
          set -o pipefail
          xcodebuild build \
            -project OneDay.xcodeproj \
            -scheme OneDayApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build-full.log
          grep -E "error:|BUILD" build-full.log | head -60 || true

      - name: Unit tests (OneDayCore)
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          set -o pipefail
          OT_ARGS=()
          if [ -n "$ONLY_TESTING" ]; then
            IFS=',' read -ra PARTS <<< "$ONLY_TESTING"
            for p in "${PARTS[@]}"; do OT_ARGS+=("-only-testing:$p"); done
          else
            OT_ARGS=(-only-testing:OneDayCoreTests -only-testing:OneDayAppTests -only-testing:OneDayUITests)
          fi
          echo "only-testing args: ${OT_ARGS[*]}"
          xcodebuild test \
            -project OneDay.xcodeproj \
            -scheme OneDayApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            "${OT_ARGS[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test-full.log
          grep -E "error:|Test Case|Executed|TEST" test-full.log | head -60 || true

      - name: Collect crash reports (.ips)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p crash-hunt/DiagnosticReports crash-hunt/DiagnosticReports-system
          cp -a ~/Library/Logs/DiagnosticReports/. crash-hunt/DiagnosticReports/ 2>/dev/null || true
          sudo cp -a /Library/Logs/DiagnosticReports/. crash-hunt/DiagnosticReports-system/ 2>/dev/null || true
          cp test-full.log crash-hunt/ 2>/dev/null || true
          ls -la crash-hunt/DiagnosticReports crash-hunt/DiagnosticReports-system || true

      - name: Upload crash reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: crash-hunt
          if-no-files-found: warn
          retention-days: 3

      - name: Symbolicate SwiftData offsets (keyboard repro)
        if: ${{ !cancelled() }}
        run: |
          bash Scripts/keyboard-repro/symbolicate.sh 2>&1 | tee symbolication.log || true

      - name: Upload symbolication output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: symbolication
          path: |
            symbolication.log
            symbolication-out
            repro-progress-collect
          if-no-files-found: warn
          retention-days: 7

      - name: Package unsigned IPA
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products -name "OneDay*.app" -type d | head -1)
          test -n "$APP"
          BIN=$(basename "$APP" .app)
          test -x "$APP/$BIN"
          echo "APP=$APP BIN=$BIN"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry oneday-unsigned.ipa Payload

      - name: Upload IPA
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: oneday-unsigned-ipa
          path: oneday-unsigned.ipa
          if-no-files-found: error
