name: Build iOS (native, unsigned IPA)

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "App/**"
      - "Project.swift"
      - "Tuist.swift"
      - "Scripts/ci/**"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:

jobs:
  build-native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # §245.1（动效规矩包）：符号动效登记核查——未入
      # SymbolMotionRegistry 的 symbolEffect/Lottie 接
      # 入点在此判红，先于构建止步
      - name: Symbol motion registry check
        run: |
          python3 Scripts/ci/check_symbol_motion.py --selftest
          python3 Scripts/ci/check_symbol_motion.py

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install Tuist
        run: brew install tuist

      - name: Generate project
        run: tuist generate --no-open

      - name: Build (no codesign)
        run: |
          set -o pipefail
          xcodebuild build \
            -project OneDay.xcodeproj \
            -scheme OneDayApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build-full.log
          grep -E "error:|BUILD" build-full.log | head -60 || true

      - name: Unit tests (OneDayCore)
        run: |
          set -o pipefail
          xcodebuild test \
            -project OneDay.xcodeproj \
            -scheme OneDayApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:OneDayCoreTests -only-testing:OneDayAppTests -only-testing:OneDayUITests \
            CODE_SIGNING_ALLOWED=NO \
            | tee test-full.log
          grep -E "error:|Test Case|Executed|TEST" test-full.log | head -60 || true

      # §241（大厂九项③拍板，DiagnosticReports 常驻化带隐私门）：
      # 只收崩溃元数据——.ips 原文不出 runner，提取脚本走字段
      # 白名单＋全文脱敏（Scripts/ci/crash_metadata.py --selftest
      # 可验）；仓库变量 CRASH_METADATA_COLLECTION=off 即整段
      # 关停（可关）；artifact retention-days 7（限期保存）。
      # 取代 2026-11-13 取证临时步 7a95fe9 的「原文全量上传」形态。
      - name: Collect crash metadata (DiagnosticReports, metadata only)
        if: ${{ !cancelled() && vars.CRASH_METADATA_COLLECTION != 'off' }}
        run: |
          mkdir -p diag-in
          cp -a ~/Library/Logs/DiagnosticReports/. diag-in/ 2>/dev/null || true
          sudo cp -a /Library/Logs/DiagnosticReports/. diag-in/ 2>/dev/null || true
          sudo chmod -R a+rX diag-in 2>/dev/null || true
          python3 Scripts/ci/crash_metadata.py --out crash-metadata diag-in
          rm -rf diag-in

      - name: Upload crash metadata
        if: ${{ !cancelled() && vars.CRASH_METADATA_COLLECTION != 'off' }}
        uses: actions/upload-artifact@v4
        with:
          name: crash-metadata
          path: crash-metadata
          if-no-files-found: warn
          retention-days: 7

      - name: Package unsigned IPA
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products -name "OneDay*.app" -type d | head -1)
          test -n "$APP"
          BIN=$(basename "$APP" .app)
          test -x "$APP/$BIN"
          echo "APP=$APP BIN=$BIN"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry oneday-unsigned.ipa Payload

      - name: Upload IPA
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: oneday-unsigned-ipa
          path: oneday-unsigned.ipa
          if-no-files-found: error
