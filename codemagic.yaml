# codemagic.yaml — OneDay iOS native build (unsigned IPA)
# 等价翻译自 .github/workflows/ios-native.yml @ build-native（试点分支 ci/codemagic-pilot）
# 非等价点：Codemagic 步骤遇错即停——测试红则不出包，与 GHA 的 §190「测试红不扣押打包」不同，判读时注意。
workflows:
  oneday-ios:
    name: OneDay iOS (native, unsigned IPA)
    instance_type: mac_mini_m2        # 免费额度仅 M2；M4 需开 billing，本试点不开
    max_build_duration: 120           # 免费档单次上限
    environment:
      xcode: 26.6                     # 对位 macos-26/Xcode 26；以 Codemagic 当期镜像为准
    scripts:
      - name: Show Xcode
        script: xcodebuild -version
      - name: Install Tuist
        script: brew install tuist
      - name: Generate project
        script: tuist generate --no-open
      - name: Build (no codesign)
        script: |
          set -o pipefail
          xcodebuild build \
            -project OneDay.xcodeproj \
            -scheme OneDayApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build-full.log
          grep -E "error:|BUILD" build-full.log | head -60 || true
      - name: Unit tests (OneDayCore)
        script: |
          set -o pipefail
          xcodebuild test \
            -project OneDay.xcodeproj \
            -scheme OneDayApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:OneDayCoreTests -only-testing:OneDayAppTests -only-testing:OneDayUITests \
            CODE_SIGNING_ALLOWED=NO \
            | tee test-full.log
          grep -E "error:|Test Case|Executed|TEST" test-full.log | head -60 || true
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products -name "OneDay*.app" -type d | head -1)
          test -n "$APP"
          BIN=$(basename "$APP" .app)
          test -x "$APP/$BIN"
          echo "APP=$APP BIN=$BIN"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry oneday-unsigned.ipa Payload
    artifacts:
      - oneday-unsigned.ipa
      - build-full.log
      - test-full.log
